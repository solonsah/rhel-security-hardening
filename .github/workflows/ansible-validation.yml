---
name: Ansible Validation

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - "inventory/example.ini"
      - "scripts/validate.sh"
      - ".ansible-lint"
      - ".yamllint"
      - "ansible.cfg"
      - "requirements-dev.txt"
      - ".github/workflows/ansible-validation.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "inventory/example.ini"
      - "scripts/validate.sh"
      - ".ansible-lint"
      - ".yamllint"
      - "ansible.cfg"
      - "requirements-dev.txt"
      - ".github/workflows/ansible-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate hardening framework
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run static validation
        run: bash scripts/validate.sh