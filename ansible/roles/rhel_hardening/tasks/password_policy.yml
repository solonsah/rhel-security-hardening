---
- name: Ensure password-quality support is installed
  ansible.builtin.dnf:
    name: libpwquality
    state: present

- name: Back up the password-quality configuration
  ansible.builtin.copy:
    src: /etc/security/pwquality.conf
    dest: "{{ rhel_hardening_backup_directory }}/pwquality.conf"
    remote_src: true
    owner: root
    group: root
    mode: preserve

- name: Configure the minimum password length
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^[#[:space:]]*minlen[[:space:]]*="
    line: "minlen = {{ rhel_hardening_password_min_length }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the minimum character classes
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "^[#[:space:]]*minclass[[:space:]]*="
    line: "minclass = {{ rhel_hardening_password_min_classes }}"
    owner: root
    group: root
    mode: "0644"